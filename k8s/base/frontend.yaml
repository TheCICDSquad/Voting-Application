apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: craftista
data:
  config.json: |
    {
      "version": "1.0.0",
      "productsApiBaseUri": "http://catalogue:5000",
      "recommendationBaseUri": "http://recommendation:8080",
      "votingBaseUri": "http://voting:8080"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: craftista
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Overridden per-environment by kustomize (see k8s/overlays/*)
          image: craftista-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
# Cost note: type LoadBalancer here provisions one AWS Network Load Balancer
# directly (~$16-20/mo) - no AWS Load Balancer Controller / Ingress / Helm
# release needed. That controller (and the internet-facing ALB it manages)
# was deliberately dropped from this stack: for a single-frontend personal
# project it's extra IAM/Helm surface for no real benefit over a plain NLB.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: craftista
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
