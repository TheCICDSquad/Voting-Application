apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting
  namespace: craftista
  labels:
    app: voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voting
  template:
    metadata:
      labels:
        app: voting
    spec:
      containers:
        - name: voting
          image: craftista-voting:latest
          ports:
            - containerPort: 8080
          # Defaults to catalogue.service-url=http://catalogue:5000/api/products
          # (see voting/src/main/resources/application.properties), which
          # already matches the "catalogue" Service name below - no override
          # needed unless routing to a different environment.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: voting
  namespace: craftista
spec:
  selector:
    app: voting
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
